<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ESG Client Interview – Sign in</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="login">
    <main class="login__container">
      <section class="login__card" aria-labelledby="login-title">
        <h1 id="login-title">Welcome back</h1>
        <p class="login__intro">
          Sign in with your assigned credentials to continue to the ESG
          preference capture experience.
        </p>
        <form id="login-form" class="login__form" autocomplete="off">
          <label class="login__label">
            Email address
            <input
              type="email"
              name="username"
              id="login-username"
              autocomplete="username"
              required
              placeholder="you@example.com"
            />
          </label>
          <label class="login__label">
            Password
            <input
              type="password"
              name="password"
              id="login-password"
              autocomplete="current-password"
              required
              placeholder="Enter your password"
            />
          </label>
          <button type="submit" class="login__submit">Sign in</button>
          <p id="login-error" class="login__error" role="alert" hidden></p>
        </form>
        <section class="login__roles" aria-label="Available roles">
          <h2>Environment roles</h2>
          <ul>
            <li><strong>Client</strong>: guided interview experience.</li>
            <li><strong>Advisor</strong>: full interview tooling and case views.</li>
            <li><strong>Admin</strong>: oversight dashboards and MI exports.</li>
          </ul>
        </section>
      </section>
    </main>

    <script type="module" src="./login.js"></script>
  </body>
</html>
